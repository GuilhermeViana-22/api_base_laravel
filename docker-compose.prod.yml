# Compose de PRODUÇÃO — um container só (Dockerfile na raiz), no mesmo formato
# do Arquiteto Online: a API sobe na 8019 e o start.sh cuida de Passport,
# migrations e da fila em segundo plano.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# O banco é externo/gerenciado (DB_HOST no .env). As variáveis vêm de
# src/.env (ou do painel do Dokploy, que injeta as mesmas chaves).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: univesp_api
    restart: unless-stopped
    env_file:
      - path: ./src/.env
        required: false
    ports:
      - '${API_PORT:-8019}:8019'
    volumes:
      # Fotos de capa e banners enviados pelo painel sobrevivem a novos deploys
      - univesp_api_public_storage:/var/www/html/storage/app/public
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.services.univesp-api.loadbalancer.server.port=8019"

networks:
  dokploy-network:
    external: true

volumes:
  univesp_api_public_storage:
